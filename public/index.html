<!DOCTYPE html>
<html lang="zh-Hant" data-theme="hylove">
<head>
    <meta charset="utf-8"/>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- 鎖定版本：沒鎖時 CDN 每次都拿最新版，daisyUI/Tailwind 一出新版樣式就可能悄悄改變。
         升級時兩個一起改、一起看過畫面。主題變數在 src/index.css（hylove）。 -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.50/daisyui.css" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
    <!-- 自訂色票（bg-bg、text-text-muted、border-border…）。以前寫在 src/index.css 的
         @theme 裡，但 CRA 不會用 Tailwind 編譯那支檔案，Tailwind 瀏覽器版也只讀
         type="text/tailwindcss" 的 <style>，所以那些 class 一直沒有作用（例如手機版頂部列
         的 border-border 變成黑線）。daisyUI 的語意色（primary 等）由 hylove 主題提供，
         這裡不重複定義。 -->
    <style type="text/tailwindcss">
      @theme {
        /* ===== 主色調 - 深墨綠 (Forest Haven) ===== */
        --color-primary-hover: #0f1812; /* 更深墨綠 */
        --color-primary-light: #e8ebe9; /* 淺墨綠背景 */

        /* ===== 次要色 - 橄欖綠 ===== */
        --color-secondary-hover: #3d4638;
        --color-secondary-light: #e9ebe7;

        /* ===== 強調色 - 赭石/赤陶 ===== */
        --color-accent-hover: #b66c48;  /* 深赭石 */
        --color-accent-light: #f7ebe3;  /* 淺赭石背景 */

        /* ===== 棕色系 ===== */
        --color-brown: #6b4b33;         /* 中棕色 */
        --color-brown-dark: #472115;    /* 深棕/咖啡 */
        --color-brown-light: #c69b7f;   /* 肉桂色 */

        /* ===== 鼠尾草綠 ===== */
        --color-sage: #9BA187;          /* 鼠尾草綠 */
        --color-sage-dark: #505B40;     /* 深鼠尾草 */
        --color-sage-light: #e8ebe4;    /* 淺鼠尾草背景 */

        /* ===== 赤陶色系 ===== */
        --color-terracotta: #B66C48;    /* 赤陶 */
        --color-terracotta-dark: #8C421F; /* 深赤陶 */
        --color-terracotta-light: #f5e6de; /* 淺赤陶背景 */

        /* ===== 背景色 ===== */
        --color-bg: #faf9f7;            /* 溫暖米白 */
        --color-bg-card: #ffffff;
        --color-bg-sidebar: #ffffff;
        --color-bg-hover: #f5f3f0;      /* 淺暖灰 */
        --color-bg-active: #ebe8e4;     /* 活動狀態背景 */
        --color-bg-cream: #E8DACB;      /* 奶油色背景 */

        /* ===== 文字色 ===== */
        --color-text: #292524;          /* 深棕黑 */
        --color-text-secondary: #57534e; /* 暖灰 */
        --color-text-muted: #78716c;    /* 淺暖灰 */
        --color-text-light: #a09f9b;    /* 更淺灰 */

        /* ===== 邊框色 ===== */
        --color-border: #e7e5e4;        /* 淺邊框 */
        --color-border-light: #f5f5f4;  /* 極淺邊框 */

        /* ===== 狀態色 - 大地色版 ===== */
        --color-success-light: #e8f0e3;
        --color-warning-light: #f7ebe3;
        --color-error-light: #f5e6de;
        --color-info-light: #e9ebe7;
      }
    </style>
    <meta name="theme-color" content="#000000"/>
    <meta
            name="description"
            content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png"/>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json"/>
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>HyLove Demo</title>
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>

</html>
